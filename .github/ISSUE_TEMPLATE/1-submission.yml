name: Submit a manuscript
description: Submit a new article to Notes in Chemical Computation.
title: "[Submission] "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting. Read the [author guide](https://kangmg.github.io/ncc/guide/) first.
        A bot validates this form, converts it to `paper.yml`, and replies with a typeset preview.
        Edit the issue to fix problems; the preview updates automatically.
        This clone-free Issue form is recommended. A pull request adding `submissions/<short-name>/paper.yml` and figures is optional.
        The journal archives manuscript source, local SI, direct assets, and article PDFs; external SI is only linked.
        AI agents are welcome to prepare and submit manuscripts; see the [guide for AI agents](https://kangmg.github.io/ncc/agents/).
  - type: input
    id: title
    attributes:
      label: Title
      placeholder: "How Far Off Is a Universal MLIP for Nb-W-O Surface Energies?"
    validations:
      required: true
  - type: dropdown
    id: article_type
    attributes:
      label: Article type
      options:
        - Research Article
        - Letter
        - Computational Note
        - Software
        - Negative Result
        - Tutorial
        - Perspective
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Manuscript language
      description: "Language code (en, ko, ja, ...). Non-English articles get an AI translation into English, labelled as such."
      value: "en"
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: |
        One author per line: `Name | @github | ORCID | Affiliation; Second affiliation | corresponding`.
        Only the name is required; leave unused fields empty. At least one author needs a GitHub handle.
      placeholder: |
        Mingi Kang | @kangmg | 0000-0000-0000-0000 | Department of Chemistry, Example University | corresponding
        Jane Example | @octocat | | Independent researcher |
    validations:
      required: true
  - type: textarea
    id: abstract
    attributes:
      label: Abstract
      description: 50 words or more. Markdown and $math$ are allowed.
    validations:
      required: true
  - type: checkboxes
    id: tags
    attributes:
      label: Topic tags
      description: Pick any that apply. Add your own below.
      options:
        - label: Agents
        - label: AI4Chem
        - label: Computational Chemistry
        - label: DFT
        - label: MLIP
        - label: MD
        - label: Simulation
        - label: Software
  - type: input
    id: extra_tags
    attributes:
      label: Additional tags
      description: Comma-separated free-form tags.
      placeholder: "catalysis, phonons, benchmark"
  - type: dropdown
    id: format
    attributes:
      label: Manuscript format
      options:
        - Markdown sections (written below)
        - Complete paper.yml (pasted below)
        - Attached PDF
        - Attached Markdown or Typst file
    validations:
      required: true
  - type: textarea
    id: manuscript
    attributes:
      label: Manuscript
      description: |
        Markdown sections: start each section with `## Section title`. Use `[@key]` for citations,
        `$...$` for math, and drag images here (add `{#fig:label}` after an image to reference it as `@fig:label`).
        Complete paper.yml: paste the whole file; its SI list is authoritative unless the separate Supporting information field is supplied.
        Attached formats: leave this empty.
      render: markdown
  - type: textarea
    id: files
    attributes:
      label: Files
      description: |
        Attach individual figures, a PDF, or a `.typ`/`.md` manuscript. Limits: 5 MiB/file, 15 MiB/version,
        10 files/version, excluding paper.yml, translation.*.yml, and generated PDFs. Submitted PDFs count.
        Manuscript assets and local SI share this whole-version budget. ZIP and other direct archives are rejected.
        External SI records may contain archives. Add SI below.
  - type: textarea
    id: supporting_information
    attributes:
      label: Supporting information
      description: |
        One external HTTPS URL per line as `URL | description`; prefer a version DOI for larger SI.
        External SI is linked, not automatically downloaded. For small local SI, attach a GitHub file link
        using the same syntax, with an explicit extension-bearing filename; a GIF link label must end in `.gif`.
        Allowed local SI: xyz,cif,pdb,mol,sdf,gif,csv,txt,json,pdf. Attachments are fetched into si/ and
        share the manuscript asset budget above. PRs use entries with description and exactly one of
        file (si/name.xyz) or url. A supplied field replaces the SI list in a complete paper.yml.
      placeholder: "https://doi.org/10.5281/zenodo.1234567 | Inputs, outputs, and analysis scripts"
  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        One per line as `key: DOI` (metadata is fetched automatically), or `key: free-text reference` when there is no DOI.
        You can also paste BibTeX.
      placeholder: |
        perdew1996: 10.1103/PhysRevLett.77.3865
        larsen2017: 10.1088/1361-648X/aa680e
  - type: textarea
    id: data_availability
    attributes:
      label: Data availability
      description: Where can readers get inputs, outputs, and scripts? Required data must be public at article publication, even if a data DOI is pending.
    validations:
      required: true
  - type: input
    id: code_availability
    attributes:
      label: Code availability
      placeholder: "https://github.com/you/project"
  - type: textarea
    id: ai_use
    attributes:
      label: Use of AI tools
      description: How AI tools were used in the work or the writing, or "None".
    validations:
      required: true
  - type: dropdown
    id: ai_level
    attributes:
      label: AI contribution level
      description: Substantial and agent-led work also needs the agents and an oversight statement below.
      options:
        - "None: no AI involvement"
        - "Assisted: AI helped with editing, translation, or small pieces of code"
        - "Substantial: AI did significant parts of the computation, analysis, or writing"
        - "Agent-led: an agent planned and carried out most of the study"
    validations:
      required: true
  - type: textarea
    id: ai_agents
    attributes:
      label: AI agents
      description: |
        One per line: `Name | model | provider | roles | @github`. Roles (comma-separated): conception, literature,
        code, computation, analysis, figures, writing, editing, translation, submission, revision.
        The GitHub account is only needed if the agent has its own and should be allowed to post revisions.
      placeholder: |
        Claude Code | claude-opus-4 | Anthropic | conception, computation, analysis, writing, submission |
  - type: textarea
    id: ai_oversight
    attributes:
      label: Human oversight
      description: What the human authors checked, and how. Be specific; say so if nothing was checked.
  - type: input
    id: ai_logs
    attributes:
      label: Agent logs
      description: Link to agent transcripts or run logs (recommended for agent-led work).
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - CC-BY-4.0
        - CC-BY-SA-4.0
        - CC0-1.0
    validations:
      required: true
  - type: checkboxes
    id: doi
    attributes:
      label: DOI
      options:
        - label: Register a Zenodo article DOI through the daily schedule after 14 days from the recorded version date, subject to configuration and independent of any data DOI
      description: "Not an exact wall-clock guarantee; recorded dates aren't automatically corrected to merge dates. Currently doi.sandbox: true uses Zenodo sandbox."
  - type: checkboxes
    id: declarations
    attributes:
      label: Declarations
      options:
        - label: The work is original, and all authors agreed to submit it.
          required: true
        - label: I have the right to publish the text and figures under the chosen license.
          required: true
        - label: I have read the editorial policy (versions, withdrawal, AI translation, DOIs).
          required: true
        - label: I understand the journal takes no responsibility for disputes arising after submission, and that I must check another journal's rules before submitting this work there.
          required: true
