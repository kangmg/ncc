name: Withdraw an article
description: Withdraw a published article. The page keeps the title, authors, dates, and your reason.
title: "[Withdrawal] "
labels: ["withdrawal"]
body:
  - type: markdown
    attributes:
      value: |
        Withdrawal removes the text and PDFs from this site. Persistent identifiers cannot be deleted:
        the article page and any DOI keep resolving to a withdrawal notice. Only listed authors can request this.
  - type: input
    id: article_id
    attributes:
      label: Article ID
      placeholder: "2026-0007"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Shown publicly on the withdrawal notice.
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I am an author of this article and understand that withdrawal cannot be undone.
          required: true
