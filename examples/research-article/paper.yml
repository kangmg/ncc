abstract: |
  Universal machine-learning interatomic potentials (MLIPs) are attractive for
  screening oxide surfaces, but their accuracy for surface energies of mixed
  transition-metal oxides is rarely reported. We compare a universal MLIP against
  PBE for 36 low-index facets of Nb, W, and Nb–W–O slabs. The MLIP systematically
  underestimates surface energies by about 14% (MAE 0.26 J m$^{-2}$) while preserving the
  facet ranking. A single linear rescaling removes most of the bias. **This is an
  example manuscript: the numbers are illustrative and exist to show the format.**
tags: [MLIP, DFT, Surface Science, Benchmark]
