sections:
  - title: Introduction
    body: |
      Universal MLIPs trained on large DFT databases [@batatia2024] promise
      near-DFT accuracy at a fraction of the cost. Surface energies are a demanding
      test because training sets are dominated by bulk structures. Here we ask a
      narrow question: is the error on Nb–W–O surfaces small enough for facet screening?
  - title: Methods
    body: |
      Reference energies were computed with PBE [@perdew1996] in VASP
      [@kresse1996]; slabs were built and relaxed with ASE [@larsen2017]. The surface
      energy of a symmetric slab is

      $$
      \gamma = \frac{E_\text{slab} - n E_\text{bulk}}{2A},
      $$

      where $n$ is the number of bulk formula units and $A$ the surface area.
      Table @tbl:setup summarises the settings.

      | Setting | PBE | MLIP |
      |---|---|---|
      | Cutoff / model | 520 eV | universal, medium |
      | k-point density | 0.25 Å$^{-1}$ | n/a |
      | Force threshold | 0.02 eV Å$^{-1}$ | 0.02 eV Å$^{-1}$ |

      : Computational settings. {#tbl:setup}
  - title: Results and Discussion
    body: |
      Figure @fig:parity compares the two methods. All points fall below the
      parity line; a least-squares fit gives $\gamma_\text{MLIP} \approx 0.86\,\gamma_\text{PBE}$
      with a mean absolute error of 0.26 J m$^{-2}$. The facet ranking is preserved
      (Spearman $\rho = 0.97$), so the MLIP is usable for ranking but not for absolute values.

      ![Parity plot of MLIP versus PBE surface energies for 36 facets (illustrative data).](figures/parity.svg){#fig:parity width=70%}
  - title: Conclusions
    body: |
      A universal MLIP ranks Nb–W–O facets reliably but underestimates absolute
      surface energies by roughly 14%. A linear correction fitted to a handful of DFT
      points is a cheap fix for screening workflows.
