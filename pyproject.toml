[project]
name = "jtools"
version = "0.1.0"
description = "Build, validation, and publishing tools for Notes in Chemical Computation"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "requests>=2.31",
  "pypdf>=4.0",
  "numpy>=2.4.6",
]

[project.optional-dependencies]
mcp = ["mcp>=2.3"]

[project.scripts]
jtools = "jtools.cli:main"
ncc-mcp = "jtools.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/jtools"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.basedpyright]
typeCheckingMode = "standard"
include = ["tools", "tests"]
